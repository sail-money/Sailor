name: Bug report
description: Report a non-security bug in Sailor (SDK, CLI, dashboard, or scaffold)
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > **⚠️ Do NOT report security vulnerabilities here.** See [SECURITY.md](../../SECURITY.md) —
        > report privately to **hello@sail.money**. Smart-contract issues belong with the
        > [protocol repo's Security Policy](https://github.com/sail-money/protocol/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.1 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: "`node --version` (not required for Docker installs)"
      placeholder: v22.11.0
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - npm (@sail.money/sailor)
        - Docker (sailmoney/sailor)
        - monorepo checkout
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sailor version
      description: "`sailor --version`, or the image tag for Docker"
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: chain
    attributes:
      label: Chain
      description: Chain name + id if chain-relevant, or "chain-independent".
      placeholder: Base (8453)
  - type: textarea
    id: command
    attributes:
      label: Command run / code executed
      description: The exact `sailor` command or SDK snippet that triggers the bug.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened — include full error output.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant (`.sail/config.json` chainId, dashboard vs CLI, etc.). Never paste keys, mnemonics, or passphrases.
