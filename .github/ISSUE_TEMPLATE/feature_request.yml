name: Feature request
description: Propose a new capability or improvement to Sailor
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        > For security concerns, do **not** use this form — see [SECURITY.md](../../SECURITY.md)
        > and report privately to hello@sail.money.
        >
        > New **permission templates** (onchain policy contracts) are a protocol-side extension —
        > consider the [protocol repo](https://github.com/sail-money/protocol) for those. This
        > form is for Sailor: the SDK, CLI, dashboard, and scaffold.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / problem
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change you'd like.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (packages/cli)
        - SDK (packages/sdk)
        - Dashboard (packages/ui)
        - Scaffold template / skills (templates/default) — higher bar, discuss first
        - Docs / tooling
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you prefer this one.
  - type: textarea
    id: context
    attributes:
      label: Additional context
