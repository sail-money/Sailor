name: Publish to Docker Hub

on:
  workflow_call:
    inputs:
      environment:
        description: "Publish channel: 'dev'/'beta' → <DOCKER_IMAGE>:dev / :beta, 'prod' → <DOCKER_IMAGE>:<ver> + :latest  (DOCKER_IMAGE repo variable)"
        type: string
        required: true
      version:
        description: 'Git ref name (e.g. v1.2.3 for tags)'
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  # Fail loud on an unknown channel instead of silently skipping every publish job.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate environment input
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$ENVIRONMENT" in
            dev|beta) ;;
            prod)
              if [ -z "$VERSION" ]; then
                echo "::error::prod publish requires a non-empty version"; exit 1
              fi ;;
            *)
              echo "::error::Invalid environment '$ENVIRONMENT' (expected dev, beta, or prod)"; exit 1 ;;
          esac

  # dev (manual builds) and beta (pushes to main) publish a single channel tag.
  publish-channel:
    needs: validate
    if: inputs.environment == 'dev' || inputs.environment == 'beta'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to sign attestations
      attestations: write  # required to push attestations to Docker Hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}:${{ inputs.environment }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-prod:
    needs: validate
    if: inputs.environment == 'prod' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to sign attestations
      attestations: write  # required to push attestations to Docker Hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract version
        id: v
        run: echo "version=${INPUT_VERSION#v}" >> $GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE }}:${{ steps.v.outputs.version }}
            ${{ vars.DOCKER_IMAGE }}:latest
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
