name: Publish to Docker Hub

on:
  workflow_call:
    inputs:
      environment:
        description: "'dev' → <DOCKER_IMAGE>:dev, 'prod' → <DOCKER_IMAGE>:<ver> + :latest  (DOCKER_IMAGE repo variable)"
        type: string
        required: true
      version:
        description: 'Git ref name (e.g. v1.2.3 for tags)'
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  publish-dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to sign attestations
      attestations: write  # required to push attestations to Docker Hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}:dev
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-prod:
    if: inputs.environment == 'prod' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to sign attestations
      attestations: write  # required to push attestations to Docker Hub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract version
        id: v
        run: echo "version=${INPUT_VERSION#v}" >> $GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE }}:${{ steps.v.outputs.version }}
            ${{ vars.DOCKER_IMAGE }}:latest
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
