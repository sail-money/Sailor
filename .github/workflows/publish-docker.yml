name: Publish to Docker Hub

on:
  workflow_call:
    inputs:
      environment:
        description: "'dev' → <DOCKER_IMAGE>:dev, 'prod' → <DOCKER_IMAGE>:<ver> + :latest  (DOCKER_IMAGE repo variable)"
        type: string
        required: true
      version:
        description: 'Git ref name (e.g. v1.2.3 for tags)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      environment:
        description: "'dev' → <DOCKER_IMAGE>:dev, 'prod' → <DOCKER_IMAGE>:<ver> + :latest  (DOCKER_IMAGE repo variable)"
        type: choice
        options: [dev, prod]
        default: dev
      version:
        description: 'Version tag (e.g. v1.2.3) — required for prod'
        type: string
        default: ''

jobs:
  tests:
    # Skipped when called from the orchestrator (workflow_call already ran tests).
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml

  publish-dev:
    needs: tests
    # always() prevents auto-skip when tests is skipped (workflow_call path).
    if: always() && inputs.environment == 'dev' && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to sign attestations
      attestations: write  # required to push attestations to Docker Hub
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKER_IMAGE }}:dev
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-prod:
    needs: tests
    # always() prevents auto-skip when tests is skipped (workflow_call path).
    if: always() && inputs.environment == 'prod' && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # required to sign attestations
      attestations: write  # required to push attestations to Docker Hub
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: v
        run: echo "version=${INPUT_VERSION#v}" >> $GITHUB_OUTPUT
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE }}:${{ steps.v.outputs.version }}
            ${{ vars.DOCKER_IMAGE }}:latest
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
