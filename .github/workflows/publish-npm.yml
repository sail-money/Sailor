name: Publish to npm

on:
  workflow_call:
    inputs:
      environment:
        description: "Publish channel: 'prod' → @sail.money/sailor@latest, 'beta' → @dev.sail.money/sailor@beta, 'dev' → @dev.sail.money/sailor@dev"
        type: string
        required: true
      version:
        description: 'Git ref name (e.g. v1.2.3 for tags, main for branches)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      package-name: ${{ inputs.environment == 'prod' && '@sail.money/sailor' || '@dev.sail.money/sailor' }}
      dist-tag: ${{ inputs.environment == 'prod' && 'latest' || inputs.environment }}
      build-number: ${{ inputs.environment != 'prod' && github.run_number || 0 }}
