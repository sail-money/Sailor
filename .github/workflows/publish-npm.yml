name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish-sdk:
        description: 'Publish the SDK package'
        type: boolean
        default: true

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      package-name: ${{ github.event_name == 'workflow_dispatch' && '@dev.sail.money/sailor' || '@sail.money/sailor' }}
      dist-tag: ${{ github.event_name == 'workflow_dispatch' && 'dev' || 'latest' }}
      make-latest: true
      build-number: ${{ github.event_name == 'workflow_dispatch' && github.run_number || 0 }}
    secrets: inherit

  publish-sdk:
    if: github.event_name != 'workflow_dispatch' || inputs.publish-sdk
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      package_dir: packages/sdk
      package-name: ${{ github.event_name == 'workflow_dispatch' && '@dev.sail.money/sdk' || '@sail.money/sdk' }}
      dist-tag: ${{ github.event_name == 'workflow_dispatch' && 'dev' || 'latest' }}
      make-latest: true
      build-number: ${{ github.event_name == 'workflow_dispatch' && github.run_number || 0 }}
    secrets: inherit
