name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    uses: SailAgent/devops-templates/.github/workflows/publish-pnpm.yaml@main
    with:
      package_dir: .
      package_version: ${{ github.ref_name }}
      pnpm-version: '11'
    secrets: inherit
