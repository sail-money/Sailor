name: Publish to npm

on:
  workflow_call:
    inputs:
      environment:
        description: "Publish channel: sets the dist-tag on the NPM_PACKAGE repo variable. 'prod' → @latest, 'beta' → @beta, 'dev' → @dev"
        type: string
        required: true
      version:
        description: 'Git ref name (e.g. v1.2.3 for tags, main for branches)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      # One package for every channel; only the dist-tag changes. Set NPM_PACKAGE
      # under repo Settings → Secrets and variables → Actions → Variables.
      package-name: ${{ vars.NPM_PACKAGE }}
      dist-tag: ${{ inputs.environment == 'prod' && 'latest' || inputs.environment }}
      build-number: ${{ inputs.environment != 'prod' && github.run_number || 0 }}
