name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      package-name: ${{ github.event_name == 'workflow_dispatch' && '@dev.sail.money/sailor' || '@sail.money/sailor' }}
      run-number: ${{ github.event_name == 'workflow_dispatch' && github.run_number || 0 }}
      dist-tag: ${{ github.event_name == 'workflow_dispatch' && 'dev' || 'latest' }}
    secrets: inherit
