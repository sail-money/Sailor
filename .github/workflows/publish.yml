name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sailor:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      registry-url: 'https://npm.pkg.github.com'
      package-name: ${{ github.event_name == 'workflow_dispatch' && '@sail-money/sailor-dev' || '@sail-money/sailor' }}
      dist-tag: 'latest'
      build-number: github.run_number
    secrets:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
