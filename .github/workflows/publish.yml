name: Publish Sail CLI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.compute.outputs.prerelease }}
      dist_tag: ${{ steps.compute.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: |
          BASE=$(node -p "require('./packages/cli/package.json').version")
          SUFFIX=${{ github.event_name == 'workflow_dispatch' && 'dev' || 'main' }}
          echo "prerelease=${BASE}-${SUFFIX}.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "dist_tag=${SUFFIX}" >> $GITHUB_OUTPUT

  publish-sdk-github:
    needs: version
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: SailAgent/devops-templates/.github/workflows/publish-npm.yaml@SAIL-131-publishing-fw
    with:
      package_dir: packages/cli
      package_name: '@sailagent/cli'
      package_version: ${{ needs.version.outputs.prerelease }}
      dist_tag: ${{ needs.version.outputs.dist_tag }}
      use_github_registry: true
    secrets: inherit

  publish-sdk-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    uses: SailAgent/devops-templates/.github/workflows/publish-npm.yaml@SAIL-131-publishing-fw
    with:
      package_dir: packages/cli
      package_version: ${{ github.ref_name }}
    secrets: inherit
