name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.compute.outputs.prerelease }}
      dist_tag: ${{ steps.compute.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: |
          BASE=$(node -p "require('./packages/sdk/package.json').version")
          SUFFIX=${{ github.event_name == 'workflow_dispatch' && 'dev' || 'main' }}
          echo "prerelease=${BASE}-${SUFFIX}.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "dist_tag=${SUFFIX}" >> $GITHUB_OUTPUT

  publish-sdk:
    needs: version
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: SailAgent/devops-templates/.github/workflows/publish-pnpm.yaml@SAIL-131-publishing-fw
    with:
      package_dir: packages/sdk
      package_name: '@sailagent/sdk'
      package_version: ${{ needs.version.outputs.prerelease }}
      dist_tag: ${{ needs.version.outputs.dist_tag }}
      use_github_registry: true
    secrets: inherit

  publish-chains:
    needs: [version, publish-sdk]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: SailAgent/devops-templates/.github/workflows/publish-pnpm.yaml@SAIL-131-publishing-fw
    with:
      package_dir: packages/chains
      package_name: '@sailagent/chains'
      package_version: ${{ needs.version.outputs.prerelease }}
      dist_tag: ${{ needs.version.outputs.dist_tag }}
      use_github_registry: true
    secrets: inherit

  publish-cli:
    needs: [version, publish-chains]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: SailAgent/devops-templates/.github/workflows/publish-pnpm.yaml@SAIL-131-publishing-fw
    with:
      package_dir: packages/cli
      package_name: '@sailagent/cli'
      package_version: ${{ needs.version.outputs.prerelease }}
      dist_tag: ${{ needs.version.outputs.dist_tag }}
      use_github_registry: true
    secrets: inherit
