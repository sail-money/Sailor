name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sailagent'
      - name: Compute version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          SUFFIX=${{ github.event_name == 'workflow_dispatch' && 'dev' || 'main' }}
          echo "prerelease=${BASE}-${SUFFIX}.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "dist_tag=${SUFFIX}" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Patch package.json for publish
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@sailagent/sailor';
            pkg.version = '${{ steps.version.outputs.prerelease }}';
            delete pkg.private;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - name: Publish
        run: pnpm publish --tag ${{ steps.version.outputs.dist_tag }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
