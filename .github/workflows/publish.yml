name: Publish

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      publish-npm:
        description: 'Publish the npm package'
        type: boolean
        default: false
      publish-docker:
        description: 'Build and publish the Docker image'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    # On manual dispatch, only run when at least one publish target is selected.
    if: github.event_name == 'push' || inputs.publish-npm || inputs.publish-docker
    uses: ./.github/workflows/tests.yml

  publish-npm:
    needs: tests
    if: github.event_name == 'push' || inputs.publish-npm
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      # Channel: tag push → prod (latest), main push → beta, manual dispatch → dev.
      environment: ${{ github.event_name == 'push' && (github.ref_type == 'tag' && 'prod' || 'beta') || 'dev' }}
      version: ${{ github.ref_name }}

  publish-github-packages:
    needs: tests
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-github-packages.yml
    with:
      # Channel: tag push → prod (latest), main push → beta, manual dispatch → dev.
      environment: ${{ github.event_name == 'push' && (github.ref_type == 'tag' && 'prod' || 'beta') || 'dev' }}
      version: ${{ github.ref_name }}

  publish-docker:
    needs: tests
    if: github.event_name == 'push' || inputs.publish-docker
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-docker.yml
    with:
      # Channel: tag push → prod (latest), main push → beta, manual dispatch → dev.
      environment: ${{ github.event_name == 'push' && (github.ref_type == 'tag' && 'prod' || 'beta') || 'dev' }}
      version: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
