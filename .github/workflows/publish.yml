name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sailor:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      registry-url: 'https://npm.pkg.github.com'
      package-name: ${{ github.event_name == 'workflow_dispatch' && '@sailagent/sailor-dev' || '@sailagent/sailor' }}
      dist-tag: ${{ github.event_name == 'workflow_dispatch' && 'dev' || 'latest' }}
      build-number: ${{ github.event_name == 'workflow_dispatch' && github.run_number || 0 }}
    secrets:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
