name: Publish to GitHub Packages

on:
  workflow_call:
    inputs:
      environment:
        description: "Publish channel: 'prod' → @sail-money/sailor@latest, 'beta' → @sail-money/sailor-dev@beta, 'dev' → @sail-money/sailor-dev@dev"
        type: string
        required: true
      version:
        description: 'Git ref name (e.g. v1.2.3 for tags, main for branches)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      registry-url: 'https://npm.pkg.github.com'
      package-name: ${{ inputs.environment == 'prod' && '@sail-money/sailor' || '@sail-money/sailor-dev' }}
      dist-tag: ${{ inputs.environment == 'prod' && 'latest' || inputs.environment }}
      build-number: ${{ inputs.environment != 'prod' && github.run_number || 0 }}
    secrets:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
