name: Publish to GitHub Packages

on:
  workflow_call:
    inputs:
      environment:
        description: "'dev' for @sail-money/sailor-dev, 'prod' for @sail-money/sailor"
        type: string
        required: true
      version:
        description: 'Git ref name (e.g. v1.2.3 for tags, main for branches)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: ./.github/workflows/publish-npm-public-pkg.yaml
    with:
      registry-url: 'https://npm.pkg.github.com'
      package-name: ${{ inputs.environment == 'prod' && '@sail-money/sailor' || '@sail-money/sailor-dev' }}
      dist-tag: latest
      build-number: ${{ inputs.environment != 'prod' && github.run_number || 0 }}
    secrets:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
