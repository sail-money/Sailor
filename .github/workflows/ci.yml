name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pure Node, reads source directly — no install/build needed. Fails if any
      # doc references a `sailor` command or `client.*` method that no longer exists.
      - name: Doc-drift check
        run: node scripts/check-docs.mjs
