packages:
  - "packages/*"
  - "templates/*"
# Allow viem's `ox` transitive dependency, which wevm resolves via a URL.
# pnpm 11 reads this setting from here, not from .npmrc.
blockExoticSubdeps: false
allowBuilds:
  '@biomejs/biome': true
  bufferutil: true
  esbuild: true
  keccak: true
  utf-8-validate: true
overrides:
  form-data@<4.0.6: ">=4.0.6"
  hono@<4.12.25: ">=4.12.25"
